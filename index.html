<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Five-Year Plan Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">5</div>
        <div><h1>Five-Year Plan Builder</h1><p>Student Transition Planning</p></div>
      </div>
      <div class="student-mini"><label for="studentNameSide">Student</label><input id="studentNameSide" type="text" placeholder="Enter name" /></div>
      <nav id="stepNav" aria-label="Plan sections"></nav>
      <div class="sidebar-actions"><button id="saveBtn" class="secondary">Save Progress</button><button id="resetBtn" class="danger ghost">Start Over</button></div>
    </aside>

    <main>
      <header class="topbar">
        <div><p class="eyebrow" id="sectionLabel">WELCOME</p><h2 id="sectionTitle">Build My Five-Year Plan</h2></div>
        <div class="progress-wrap"><span id="progressText">0% complete</span><div class="progress-track"><div id="progressBar"></div></div></div>
      </header>
      <section id="content" class="content-card"></section>
      <footer class="page-footer">
        <div class="footer-progress"><div class="footer-progress-row"><strong id="footerStep">Step 1 of 10</strong><span id="footerProgressText">0% complete</span></div><div class="progress-track"><div id="footerProgressBar"></div></div></div>
        <div class="bottom-nav"><button id="backBtn" class="secondary">Back</button><button id="nextBtn" class="primary">Next</button></div>
      </footer>
    </main>
  </div>

  <script src="jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
