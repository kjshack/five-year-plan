.timeline{display:grid;gap:11px}.trow{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px}.trow small{display:block;color:var(--muted);margin-top:3px}.years{display:flex;gap:5px;flex-wrap:wrap}.yb input{position:absolute;opacity:0}.yb label{display:grid;place-items:center;width:54px;height:40px;border:2px solid var(--line);border-radius:8px;font-weight:700}.yb input:checked+label{background:var(--a);border-color:var(--a);color:#fff}
.review{display:grid;grid-template-columns:1fr 1fr;gap:13px}.rcard,.yplan{border:1px solid var(--line);border-radius:13px;padding:15px}.rcard h4{margin:0 0 7px;color:var(--a)}.rcard p{margin:4px 0;line-height:1.55;font-size:17px}.yplan{margin-bottom:16px}.yplan h3{margin-top:0}.keys{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 14px}.key{background:var(--p);border:1px solid #efbd97;border-radius:999px;padding:9px 13px;font-size:16px;line-height:1.3}.key.challenge-key{background:#fff3d6;border-color:#e1a83a;color:#7a4c00}.challenge-section{border-left:5px solid #d28a00;background:#fffaf0;border-radius:12px;padding:16px;margin-top:16px}.challenge-section .st{color:#8a5600}.plantext{min-height:190px;width:100%;padding:15px;border:1px solid #cbd4df;border-radius:10px;font-size:18px;line-height:1.6}.guide{margin:14px 0;border:1px solid var(--line);border-radius:12px;background:#fafbfd}.guide>summary{cursor:pointer;font-weight:800;padding:12px;color:var(--a)}.guide-body{padding:0 12px 12px}.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.guide-group{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.guide-group h4{margin:0 0 8px}.starter{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #edf1f5;padding:8px 0}.starter:first-of-type{border-top:0}.starter button{flex:0 0 auto}.thinking{background:var(--p);border-radius:10px;padding:10px;margin:10px 0;font-size:13px;line-height:1.5}.writing-status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:14px}.writing-count{font-weight:800}.writing-message{color:#9a2f2f}.writing-message.ok{color:#26723a}.plantext.invalid{border:2px solid #d56a6a;background:#fffafa}.plantext.valid{border:2px solid #75b982}.btn:disabled{opacity:.5;cursor:not-allowed}

<body><div class="app"><aside class="side"><div class="brand"><div class="logo">5</div><div><h1>FuturePath</h1><p>Five-Year Plan Builder</p></div></div><nav id="nav"></nav><div class="note">Answers save automatically in this browser. Download saved answers before switching computers.</div></aside>
<main><header class="top"><div><p class="eyebrow" id="eye"></p><h2 id="title"></h2></div><div class="prog"><div class="prow"><span id="step"></span><span id="pct"></span></div><div class="track"><div class="bar" id="bar"></div></div></div></header><div class="flash" id="flash"></div><section class="card" id="content"></section><div class="actions"><button class="btn secondary" id="back">Back</button><div><button class="btn danger" id="reset">Start Over</button> <button class="btn primary" id="next">Next</button></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/docx@9.5.0/dist/index.iife.js"></script>
<script>
const STORE="futurePathV3_7_option_updates";
const steps=[
["Home","WELCOME","FuturePath Five-Year Plan"],
["Start My Plan","START HERE","Start My Plan"],
["Strengths & Growth","ABOUT ME","My Strengths & Growth"],
["Career & Training","CAREER PATH","Career & Training"],
["Supports & Living","INDEPENDENCE","Supports & Independent Living"],
["Timeline","MY ROADMAP","Place My Goals Across Five Years"],
["Check It","REVIEW","Check My Choices"],
["My Plan","WRITE MY PLAN","My Five-Year Plan"],
["Customize & Download","MAKE IT MINE","Customize & Download"]];
const O={
personal:["Have a pet","Travel somewhere new","Have a boyfriend, girlfriend, or significant other","Get married","Have a child or family","Make new friends","Spend more time with friends","Spend more time with family","Join a club, team, group, or community activity","Learn to play an instrument","Learn another language","Learn to cook","Improve my health or fitness","Volunteer","Develop a hobby","Become more confident","Become more independent","I am not sure yet"],
strengths:["Working with my hands","Working with words","Working with numbers","Working independently","Working with a team","Helping people","Working with children","Working with older adults","Paying attention to details","Being creative","Being dependable","Being patient","Being empathetic","Solving problems","Being flexible","Communicating","Following directions","Technology"],

vision:["Working full time","Working part time","Attending a four-year university","Attending community college","Attending trade or technical school","Completing a certificate program","Serving in the military","Completing an apprenticeship","Receiving on-the-job training","Volunteering","Owning a business","Still exploring"],
career:[

"Construction & Repair — carpenter, electrician, maintenance worker",
"Art, Media & Communication — graphic designer, photographer, content creator",
"Business & Office Work — receptionist, office assistant, manager",
"Education & Child Care — teacher, teacher assistant, daycare worker",
"Money & Banking — bank teller, bookkeeper, accountant",
"Government & Community Service — postal worker, city worker, public service assistant",
"Health & Medical — nurse, medical assistant, pharmacy technician",
"Restaurants, Hotels & Travel — cook, server, hotel worker",
"Helping & Personal Services — social worker, hairstylist, caregiver",
"Computers & Technology — computer support worker, web designer, programmer",
"Law, Safety & Security — police officer, firefighter, security guard",
"Manufacturing & Production — machine operator, assembler, quality inspector",
"Marketing, Sales & Retail — cashier, salesperson, store associate",
"Science, Engineering & Design — lab technician, engineer, drafter",
"Transportation & Delivery — driver, mechanic, warehouse worker"
],
training:["Four-year university","Community college","Technical or trade school","Certificate program","Apprenticeship","Internship","On-the-job training","Military training","Mentor","Job coach","I am not sure yet"],
help:["Family","Teacher","School counselor","Mentor","Job coach","Vocational Rehabilitation counselor","Tutor","College disability services","Coworker or supervisor","Transportation support"],
living:["Live with family","College dorm","Apartment alone","Apartment with a roommate","Supported living","Own a home","I am not sure yet"],
transport:["Drive my own car","Ride with family or friends","Public transportation","Walk or bicycle","Taxi or ride service","Rideshare","Transportation support","I am not sure yet"],
money:["Open a bank account","Learn to make a budget","Save money","Pay my own bills","Build credit","Save for a car","Save for housing","Get scholarships","Get grants","Get student loans","I am not sure yet"],
independent:["Cook meals","Shop for groceries","Clean my home","Do laundry","Manage medicine","Make appointments","Use transportation","Get my driver's permit","Get my driver's license","Stay safe in the community","Manage my schedule","Ask for help when needed"],
visionChallenges:["I may change my mind about my future plans","I may need more information about my options","I may need help choosing between work and more training","I may need to improve my grades or school attendance","I may need accommodations or extra support"],
personalChallenges:["I may feel nervous trying new things","I may have trouble making or keeping friends","I may need help managing my emotions","My family may not agree with all of my plans","I may need to become more confident or independent"],
strengthChallenges:["I may have trouble recognizing my strengths","I may need more practice using my strengths","I may have difficulty asking for help","I may get discouraged when something is hard","I may need reminders to stay organized"],
careerChallenges:["I may not know which career fits me yet","I may not have enough work experience","I may need help completing applications","I may need to improve my interview skills","I may need accommodations at work","There may not be many openings in the job I want"],
trainingChallenges:["Training or school may cost too much","I may need help finding the right program","I may need transportation to training","I may need help completing forms or applications","I may need extra time or learning support"],
livingChallenges:["Housing may cost too much","I may need help finding a safe place to live","I may not be ready to live on my own","I may need support with chores or daily routines","I may need a roommate or supported living"],
transportChallenges:["I may not have a driver's license","I may not have access to a car","Public transportation may be limited","I may need help learning a route","Transportation may cost too much"],
moneyChallenges:["I may have trouble saving money","I may need help making a budget","I may not understand bills, credit, or banking","I may not earn enough money at first","Unexpected expenses may come up"],
independentChallenges:["I may forget appointments or tasks","I may need more practice with cooking or cleaning","I may need help managing medicine","I may have trouble managing my time","I may need help staying safe in the community"],
supportChallenges:["I may not know who to ask for help","I may feel uncomfortable asking for help","A support person may not always be available","I may need help finding adult services","I may need to explain the supports that work best for me"]};
const D={studentName:"",grade:"",gradYear:new Date().getFullYear()+1,personalGoals:[],personalOther:"",personalWhy:"",strengths:[],strengthsOther:"",growth:[],growthOther:"",vision:[],visionOther:"",careerAreas:[],careerAreasOther:"",careerChoice:"",training:[],trainingOther:"",trainingHelp:[],trainingHelpOther:"",living:[],livingOther:"",transport:[],transportOther:"",money:[],moneyOther:"",independent:[],independentOther:"",supports:[],supportsOther:"",
visionChallenges:[],visionChallengesOther:"",personalChallenges:[],personalChallengesOther:"",
strengthChallenges:[],strengthChallengesOther:"",careerChallenges:[],careerChallengesOther:"",
trainingChallenges:[],trainingChallengesOther:"",livingChallenges:[],livingChallengesOther:"",
transportChallenges:[],transportChallengesOther:"",moneyChallenges:[],moneyChallengesOther:"",
independentChallenges:[],independentChallengesOther:"",supportChallenges:[],supportChallengesOther:"",
timeline:{},yearWriting:["","","","",""],theme:"orange",decoration:"clean",images:{headshot:"",dream:"",career:"",year1:"",year2:"",year3:"",year4:"",year5:""}};
let S;try{S=Object.assign(structuredClone(D),JSON.parse(localStorage.getItem(STORE)||"{}"));S.images=Object.assign({},D.images,S.images||{});S.timeline=S.timeline||{};S.yearWriting=[0,1,2,3,4].map(i=>(S.yearWriting||[])[i]||"")}catch(e){S=structuredClone(D)}let cur=Number(localStorage.getItem(STORE+"Step")||0); if(cur<0||cur>=steps.length)cur=0;
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(STORE,JSON.stringify(S));localStorage.setItem(STORE+"Step",cur)}
function flash(t){$("#flash").textContent=t;$("#flash").style.display="block";setTimeout(()=>$("#flash").style.display="none",2200)}
function displayChoice(path,x){
if(path==="careerAreas"&&x.includes(" — ")){
const parts=x.split(" — ");
return `<strong>${esc(parts[0])}</strong><br><span style="font-weight:400">${esc(parts.slice(1).join(" — "))}</span>`
}
return esc(x)
}
function group(path,items,sel){return `<div class="choices">${items.map((x,i)=>`<div class="choice"><input id="${path}${i}" type="checkbox" data-array="${path}" value="${esc(x)}" ${(sel||[]).includes(x)?"checked":""}><label for="${path}${i}">${displayChoice(path,x)}</label></div>`).join("")}</div>`}
function other(path,val,ph="Type another choice"){return `<div class="field other"><label>Other</label><input data-field="${path}" value="${esc(val)}" placeholder="${esc(ph)}"></div>`}
function help(path,ideas){return `<details class="help"><summary>Need Help Getting Started?</summary><div class="chips">${ideas.map(x=>`<button type="button" class="chip" data-fill="${path}" data-text="${esc(x)}">${esc(x)}</button>`).join("")}</div></details>`}
function challengeBlock(path,otherPath,items,title="Challenges I May Face"){return `<div class="challenge-section"><div class="st">${esc(title)}</div><p class="hint">Choose any challenges that could make this goal harder. You can choose more than one.</p>${group(path,items,S[path])}${other(otherPath,S[otherPath],"Another challenge I may face")}</div>`}
function all(a,o){return [...(a||[]),...(o&&String(o).trim()?[String(o).trim()]:[])]}
function render(){document.body.className=S.theme;$("#nav").innerHTML=steps.map((s,i)=>`<button data-step="${i}" class="${i===cur?"active":""}">${i+1}. ${s[0]}</button>`).join("");$("#eye").textContent=steps[cur][1];$("#title").textContent=steps[cur][2];$("#step").textContent=`Step ${cur+1} of ${steps.length}`;let p=Math.round((cur+1)/steps.length*100);$("#pct").textContent=p+"% complete";$("#bar").style.width=p+"%";$("#back").disabled=cur===0;$("#next").textContent=cur===steps.length-1?"Save Progress":"Next";$("#content").innerHTML=page(cur);bind()}
function page(i){
if(i===0)return `<div class="intro" style="text-align:center;padding:42px 24px"><h1 style="font-size:42px;margin:0 0 14px;color:var(--a)">FuturePath</h1><h2 style="font-size:28px;margin:0 0 14px">Build Your Five-Year Plan</h2><p style="font-size:18px;max-width:720px;margin:0 auto 24px;line-height:1.6">Think about your future, choose your goals, organize them across five years, and create a plan in your own words.</p><button type="button" class="btn primary" id="startHome" style="font-size:18px;padding:14px 24px">Start My Plan</button></div><div class="review"><div class="rcard"><h4>1. Choose</h4><p>Select career, education, personal, social, and independent-living goals.</p></div><div class="rcard"><h4>2. Organize</h4><p>Place each goal into one or more years on your timeline.</p></div><div class="rcard"><h4>3. Write</h4><p>Use your selected keywords to explain each year in your own words.</p></div><div class="rcard"><h4>4. Create</h4><p>Add pictures and a theme, then download or print your finished plan.</p></div></div>`;

if(i===1)return `<div class="intro"><h3>Let’s build a plan that sounds like you.</h3><p>Start with your information, then choose career, education, personal, and social goals.</p></div>
<div class="grid3"><div class="field"><label>Your name</label><input data-field="studentName" value="${esc(S.studentName)}"></div><div class="field"><label>Current grade</label><select data-field="grade"><option value="">Choose</option>${[9,10,11,12].map(x=>`<option ${String(S.grade)===String(x)?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Expected graduation year</label><input type="number" data-field="gradYear" value="${esc(S.gradYear)}"></div></div>
<div class="section"><div class="st">Career / Education Goals</div><p class="hint">What might you be doing during the next five years? Choose every answer that could be part of your future.</p>${group("vision",O.vision,S.vision)}${other("visionOther",S.visionOther,"Something else I may be doing")}${challengeBlock("visionChallenges","visionChallengesOther",O.visionChallenges)}</div>
<div class="section"><div class="st">Personal / Social Goals</div><p class="hint">Choose all that matter to you.</p>${group("personalGoals",O.personal,S.personalGoals)}${other("personalOther",S.personalOther,"Another personal or social goal")}${challengeBlock("personalChallenges","personalChallengesOther",O.personalChallenges)}</div>
<div class="field"><label>Why are these personal or social goals important to you?</label><textarea data-field="personalWhy">${esc(S.personalWhy)}</textarea>${help("personalWhy",["These goals will help me become more independent.","These goals would make me happy and help me grow.","These goals are part of the life I want after high school."])}</div>`;

if(i===2)return `<div class="intro"><h3>What are you good at, and what would you like to improve?</h3><p>Choose your answers without writing an extra story.</p></div>
<div class="section"><div class="st">My Strengths</div><p class="hint">Choose up to five.</p>${group("strengths",O.strengths,S.strengths)}${other("strengthsOther",S.strengthsOther,"Another strength")}${challengeBlock("strengthChallenges","strengthChallengesOther",O.strengthChallenges)}</div>
<div class="section"><div class="st">Areas I Want to Improve</div>${group("growth",O.growth,S.growth)}${other("growthOther",S.growthOther,"Another area")}</div>`;

if(i===3)return `<div class="intro"><h3>Explore career and training choices.</h3><p>Each career area includes examples to make the categories easier to understand. Veterinarian and veterinary technician are under Animals, Plants & the Environment.</p></div>
<div class="section"><div class="st">Career areas I may want to explore</div><p class="hint">Choose one or more career areas.</p>${group("careerAreas",O.career,S.careerAreas)}${other("careerAreasOther",S.careerAreasOther,"Another career area")}${challengeBlock("careerChallenges","careerChallengesOther",O.careerChallenges)}</div>
<div class="field"><label>What specific job or career would you like to have?</label><input data-field="careerChoice" value="${esc(S.careerChoice)}" placeholder="Example: veterinary assistant">${help("careerChoice",["Veterinary assistant","Auto mechanic","Welder","Teacher assistant","Nurse","Computer support specialist","Chef or cook","Cashier or customer service worker"])}</div>
<div class="section"><div class="st">Education or training I may need</div>${group("training",O.training,S.training)}${other("trainingOther",S.trainingOther,"Another type of training")}${challengeBlock("trainingChallenges","trainingChallengesOther",O.trainingChallenges)}</div>`;

if(i===4)return `<div class="intro"><h3>Think about the skills, services, and supports that may help you become more independent.</h3></div>
<div class="section"><div class="st">Where I may live</div>${group("living",O.living,S.living)}${other("livingOther",S.livingOther)}${challengeBlock("livingChallenges","livingChallengesOther",O.livingChallenges)}</div>
<div class="section"><div class="st">How I may get around</div>${group("transport",O.transport,S.transport)}${other("transportOther",S.transportOther)}${challengeBlock("transportChallenges","transportChallengesOther",O.transportChallenges)}</div>
<div class="section"><div class="st">Money skills and goals</div>${group("money",O.money,S.money)}${other("moneyOther",S.moneyOther)}${challengeBlock("moneyChallenges","moneyChallengesOther",O.moneyChallenges)}</div>
<div class="section"><div class="st">Independent living skills I need to learn</div>${group("independent",O.independent,S.independent)}${other("independentOther",S.independentOther)}${challengeBlock("independentChallenges","independentChallengesOther",O.independentChallenges)}</div>
<div class="section"><div class="st">People or services that may support me</div>${group("supports",O.help,S.supports)}${other("supportsOther",S.supportsOther)}${challengeBlock("supportChallenges","supportChallengesOther",O.supportChallenges)}</div>`;

if(i===5){let it=items();return `<div class="intro"><h3>Choose every year that applies.</h3><p>An activity can appear in more than one year. Strengths and growth areas do not appear on this timeline.</p></div><div class="timeline">${it.length?it.map(row).join(""):"<p>Please make choices on earlier pages first.</p>"}</div>`}

if(i===6)return `<div class="intro"><h3>Here is what you selected.</h3><p>Your choices are organized under the headings below.</p></div><div class="review">${cards()}</div><div class="section"><div class="st">Timeline by Year</div>${summary()}</div>`;

if(i===7)return `<div class="intro"><h3>Use the ideas above each box to write your plan in your own words.</h3><p>The keywords help you remember what you chose.</p></div>${[1,2,3,4,5].map(yearPlan).join("")}`;

function sentenceCount(text){const m=String(text||"").trim().match(/[^.!?]+[.!?]+(?=\s|$)/g);return m?m.length:0}
function writingStats(text){const chars=String(text||"").trim().length,sentences=sentenceCount(text);return {chars,sentences,valid:chars>=400&&sentences>=5}}
function allWritingValid(){return S.yearWriting.every(x=>writingStats(x).valid)}
function updateWritingGate(){

})
}

$$("[data-starter]").forEach(b=>b.onclick=()=>{const i=+b.dataset.starter;const starter=b.dataset.text;const existing=(S.yearWriting[i]||"").trimEnd();S.yearWriting[i]=existing?existing+"\n\n"+starter:starter;save();render();setTimeout(()=>{const box=document.querySelector(`[data-write="${i}"]`);if(box){box.focus();box.selectionStart=box.selectionEnd=box.value.length}},0)});$$('input[name="theme"]').forEach(x=>x.onchange=()=>{S.theme=x.value;save();render()});$$('input[name="dec"]').forEach(x=>x.onchange=()=>{S.decoration=x.value;save()});$$("[data-image]").forEach(x=>x.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{S.images[x.dataset.image]=r.result;save();render()};r.readAsDataURL(f)});$$("[data-remove]").forEach(b=>b.onclick=()=>{S.images[b.dataset.remove]="";save();render()});if($("#startHome"))$("#startHome").onclick=()=>{cur=1;save();render()};if($("#print"))$("#print").onclick=printPlan;if($("#docx"))$("#docx").onclick=downloadDocx;if($("#html"))$("#html").onclick=downloadPlan;if($("#data"))$("#data").onclick=()=>blob(JSON.stringify(S,null,2),"application/json",base()+"_saved_answers.json");updateWritingGate()}
$("#back").onclick=()=>{if(cur>0){cur--;save();render()}};$("#next").onclick=()=>{if(cur===7&&!allWritingValid()){flash("Each year needs at least 400 characters and 5 sentences.");updateWritingGate();return}if(cur<steps.length-1){cur++;save();render()}else flash("Your progress is saved.")};$("#reset").onclick=()=>{if(confirm("Clear all answers and start over?")){S=structuredClone(D);cur=0;localStorage.removeItem(STORE);render()}};

async function dataUriToBytes(uri){
if(!uri)return null;
const response=await fetch(uri);
return new Uint8Array(await response.arrayBuffer())
}
async function downloadDocx(){
if(!window.docx){flash("The Word exporter could not load. Check your internet connection and try again.");return}
const {Document,Packer,Paragraph,TextRun,HeadingLevel,AlignmentType,ImageRun,PageBreak}=window.docx;
const color=themeHex();
const children=[];
const addHeading=(text,level=HeadingLevel.HEADING_1,center=false)=>children.push(new Paragraph({heading:level,alignment:center?AlignmentType.CENTER:AlignmentType.LEFT,children:[new TextRun({text,bold:true,color})]}));
const addText=(text,center=false)=>children.push(new Paragraph({alignment:center?AlignmentType.CENTER:AlignmentType.LEFT,spacing:{after:180},children:[new TextRun({text:String(text||"")})]}));
const addList=(values)=>addText((values&&values.length)?values.join(" • "):"Not selected");
const addImage=async(key,width=220,height=165)=>{
if(!S.images[key])return;
try{
const data=await dataUriToBytes(S.images[key]);
children.push(new Paragraph({alignment:AlignmentType.CENTER,children:[new ImageRun({data,transformation:{width,height}})]}))
}catch(e){}
};
addHeading("My Five-Year Plan",HeadingLevel.TITLE,true);
addHeading(S.studentName||"Student Name",HeadingLevel.HEADING_1,true);
addText("Expected graduation year: "+(S.gradYear||""),true);
await addImage("headshot",220,180);
children.push(new Paragraph({children:[new PageBreak()]}));

addHeading("My Personal Goals");
addList(all(S.personalGoals,S.personalOther));
addHeading("Why These Goals Matter to Me",HeadingLevel.HEADING_2);
addText(S.personalWhy||"Not written yet.");
children.push(new Paragraph({children:[new PageBreak()]}));

addHeading("My Strengths & Growth");
addHeading("My Strengths",HeadingLevel.HEADING_2);
addList(all(S.strengths,S.strengthsOther));
addHeading("Areas I Want to Improve",HeadingLevel.HEADING_2);
addList(all(S.growth,S.growthOther));
addHeading("Career / Education Goals",HeadingLevel.HEADING_2);
addList(all(S.vision,S.visionOther));
children.push(new Paragraph({children:[new PageBreak()]}));

addHeading("Career & Training");
await addImage("career",220,165);
addHeading("Career Areas",HeadingLevel.HEADING_2);
addList(all(S.careerAreas,S.careerAreasOther));
addHeading("Specific Job or Career",HeadingLevel.HEADING_2);
addText(S.careerChoice||"Not selected");
addHeading("Education or Training",HeadingLevel.HEADING_2);
addList(all(S.training,S.trainingOther));

for(let y=1;y<=5;y++){
children.push(new Paragraph({children:[new PageBreak()]}));
addHeading(`Year ${y} — ${Number(S.gradYear||new Date().getFullYear())+y-1}`);
await addImage("year"+y,220,165);
addHeading("My Ideas",HeadingLevel.HEADING_2);
addList(yearGoals(y).map(x=>x.text));
addHeading("Challenges I May Face",HeadingLevel.HEADING_2);
addList(yearChallenges(y).map(x=>x.text));
addHeading("My Plan",HeadingLevel.HEADING_2);
addText(S.yearWriting[y-1]||"Not written yet.")
}

styles:{default:{document:{run:{font:"Aptos",size:28}}},paragraphStyles:[

function blob(c,t,n){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function base(){return(S.studentName||"student").replace(/[^a-z0-9]+/gi,"_")}render();
